<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main-container">
            <div class="header">
                <div class="logo">
                    <h1 class="logo-text">Coder <span class="logo-text2">Help</span></h1>
                </div>
                <div class="menu-boxes">
                    <div class="menu-box">
                        <h3 class="menu1">[Dashboard]</h3>
                    </div>
                    <div class="menu-box">
                        <h3 class="menu2">[Explore Paths]</h3>
                    </div>
                    <div class="menu-box">
                        <h3 class="menu3">[Video Library]</h3>
                    </div>
                    <div class="menu-box">
                        <h3 class="menu4">[Sign Out]</h3>
                    </div>
                </div>
            </div>
            <div class="welcome">
                <div class="wel-img1">
                    <img src="rocket_ch.svg" class="rocket-img" alt="Neon Rocket">
                </div>
                <div class="wel-txt">
                    <h1 class="wel-title">Ready to build?</h1>
                    <h3 class="wel-desc">Explore your coding future today.</h3>
                </div>
                <div class="wel-img2">
                    <img src="laptop_ch.svg" class="laptop-img" alt="Neon Rocket">
                </div>
            </div>
            <div class="cont-learning-txt">
                <h3 class="cont-learning-title">Continue learning</h3>
                <a class="all-paths" href="explore_paths.html">View all paths →</a>
            </div>
            <div class="cont-learnings">
                <div class="cont-learning">
                    <div class="lang-img">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Python-logo-notext.svg/960px-Python-logo-notext.svg.png" class="py-img" alt="py-img">
                    </div>
                    <div class="lang-desc">
                        <div class="desc-title">
                            <h3 class="core-track">CORE TRACK</h3>
                        </div>
                        <div class="desc-name">
                            <h3 class="lang-name">Python</h3>
                        </div>
                        <div class="desc-bar">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="bar-value">
                            <h4 class="bar-data">0% </h4>
                            <h4 class="bar-data2">40 Total Lessons</h4>
                        </div>
                        <div class="explore-track">
                            <button class="explore-btn">Explore Track ></button>
                        </div>
                    </div>
                </div>
                <div class="cont-learning">
                    <div class="lang-img">
                        <img src="web-img.svg" class="web-img" alt="web-img">
                    </div>
                    <div class="lang-desc">
                        <div class="desc-title">
                            <h3 class="core-track">CORE TRACK</h3>
                        </div>
                        <div class="desc-name">
                            <h3 class="lang-name">Web Development</h3>
                        </div>
                        <div class="desc-bar">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="bar-value">
                            <h4 class="bar-data">0% </h4>
                            <h4 class="bar-data2">60 Total Lessons</h4>
                        </div>
                        <div class="explore-track">
                            <button class="explore-btn">Explore Track ></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
